# ==============================================================================
# CONFIGURACIÓN DE MIGRACIONES ALEMBIC - POSTGRESQL 16
# ==============================================================================
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Formato de nombres de archivo de migración
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# La URL de conexión se inyecta dinámicamente desde src.core.config.get_settings().sync_database_url
sqlalchemy.url = postgresql+psycopg2://erp_admin:dev_postgres_password_2026@localhost:5432/meli_erp_db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
