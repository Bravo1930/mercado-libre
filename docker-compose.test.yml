# ==============================================================================
# ORQUESTACIÓN ENTORNO DE PRUEBAS AUTOMATIZADAS (CI/CD)
# Uso: docker compose -f docker-compose.test.yml up --abort-on-container-exit --exit-code-from test_runner
# ==============================================================================

networks:
  meli_erp_test_net:
    name: meli_erp_test_net

services:
  test_postgres:
    image: postgres:16-alpine
    container_name: meli_erp_test_postgres
    environment:
      POSTGRES_DB: test_meli_erp_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    tmpfs:
      - /var/lib/postgresql/data # Base de datos en RAM para máxima velocidad en tests
    networks:
      - meli_erp_test_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_meli_erp_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  test_redis:
    image: redis:7-alpine
    container_name: meli_erp_test_redis
    networks:
      - meli_erp_test_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  test_runner:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: meli_erp_test_runner
    environment:
      - ENVIRONMENT=testing
      - POSTGRES_HOST=test_postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=test_meli_erp_db
      - POSTGRES_USER=test_user
      - POSTGRES_PASSWORD=test_password
      - REDIS_HOST=test_redis
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=test_secret_for_automated_testing_purposes_only_64_characters
      - TOKEN_ENCRYPTION_KEY=gK7m4a0_qN2s8u1v5x9z_B4c6e8h0j2l4n6p8r0t2v4=
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
    networks:
      - meli_erp_test_net
    depends_on:
      test_postgres:
        condition: service_healthy
      test_redis:
        condition: service_healthy
    command: ["pytest", "-v", "--cov=src", "--cov-report=term-missing"]
