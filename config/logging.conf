[loggers]
keys=root,uvicorn,erp

[handlers]
keys=console,file

[formatters]
keys=generic,json

[logger_root]
level=INFO
handlers=console,file

[logger_uvicorn]
level=INFO
handlers=console
qualname=uvicorn
propagate=0

[logger_erp]
level=DEBUG
handlers=console,file
qualname=erp
propagate=0

[handler_console]
class=StreamHandler
level=DEBUG
formatter=generic
args=(sys.stdout,)

[handler_file]
class=logging.handlers.RotatingFileHandler
level=INFO
formatter=generic
args=('logs/erp.log', 'a', 10485760, 5, 'utf-8')

[formatter_generic]
format=%(asctime)s [%(levelname)s] [%(name)s:%(lineno)d] - %(message)s
datefmt=%Y-%m-%d %H:%M:%S

[formatter_json]
format={"timestamp": "%(asctime)s", "level": "%(levelname)s", "module": "%(name)s", "line": %(lineno)d, "message": "%(message)s"}
datefmt=%Y-%m-%dT%H:%M:%S%z
