# ==============================================================================
# CONFIGURACIÓN DE PROMETHEUS - MONITORING ERP MERCADO LIBRE MÉXICO
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  # - "alert_rules.yml"

scrape_configs:
  # Recolección del API del ERP
  - job_name: "meli_erp_api"
    metrics_path: "/metrics"
    scheme: "http"
    static_configs:
      - targets: ["api:8000"]
        labels:
          environment: "production"
          service: "meli-erp-backend"

  # Recolección del proxy Caddy (si expone métricas internas)
  - job_name: "caddy"
    static_configs:
      - targets: ["caddy:2019"]
        labels:
          service: "caddy-reverse-proxy"
